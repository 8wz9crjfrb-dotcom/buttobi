<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1f3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="トバセ！" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>トバセ！</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud" class="hidden"></div>
      <div id="touch" class="hidden">
        <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
        <div id="buttons">
          <button class="pad-btn" id="btn-a" data-btn="1">A<small>攻撃</small></button>
          <button class="pad-btn" id="btn-b" data-btn="2">B<small>必殺</small></button>
          <button class="pad-btn" id="btn-jump" data-btn="4">↑<small>ジャンプ</small></button>
          <button class="pad-btn" id="btn-shield" data-btn="8">◎<small>ガード</small></button>
        </div>
      </div>
      <button id="pause-btn" class="hidden" aria-label="メニュー">II</button>
      <div id="screens"></div>
      <div id="toast" class="hidden"></div>
    </div>
    <div id="rotate">
      <div class="rotate-icon">📱</div>
      <p>横向きにしてください</p>
      <p class="sub">このゲームは横持ちで遊びます</p>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
