name = "buttobi-server"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 無料プランでは SQLite 型の Durable Objects のみ使える
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# データ引き継ぎ（引き継ぎコードごとに、データを一時的に預かる）
[[durable_objects.bindings]]
name = "TRANSFERS"
class_name = "TransferBox"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TransferBox"]

# フレンド機能（フレンドコード・申請・オンライン・フレンドに公開したルーム）
[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "Social"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Social"]

# ---------------------------------------------------------------
# テスト用サーバー（本番の前に新機能を試す）。test ブランチに push すると、
# 「wrangler deploy --env test」で buttobi-server-test という別の Worker に出す。
# データ（ルーム・フレンド・DM）は本番とは別。Durable Objects の設定は環境ごとに書く必要がある
[env.test]
name = "buttobi-server-test"

[[env.test.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.test.durable_objects.bindings]]
name = "TRANSFERS"
class_name = "TransferBox"

[[env.test.durable_objects.bindings]]
name = "SOCIAL"
class_name = "Social"
