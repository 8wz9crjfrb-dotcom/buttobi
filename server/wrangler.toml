name = "buttobi-server"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 無料プランでは SQLite 型の Durable Objects のみ使える
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# データ引き継ぎ（引き継ぎコードごとに、データを一時的に預かる）
[[durable_objects.bindings]]
name = "TRANSFERS"
class_name = "TransferBox"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TransferBox"]
