# 対戦サーバー（Cloudflare Workers）を自動で更新する。
# main に push したとき、サーバーに関わるファイル（server/ と src/shared/）が変わっていれば、
# テストを通してから wrangler deploy を行う。Actions の画面から手動でも実行できる。
#
# 最初に一度だけ、リポジトリの Settings → Secrets and variables → Actions → Secrets に次の2つを登録する：
#   CLOUDFLARE_API_TOKEN  … Cloudflare で「Edit Cloudflare Workers」テンプレートから作った API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウントID
# 登録していない間は、更新の手順を飛ばす（失敗にはしない）。
name: Deploy server to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/shared/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 対戦の計算（シミュレーション）のテストを通ったときだけ更新する
      - run: npm ci
      - run: npm test
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Deploy Worker
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
      - name: Skip (secrets not set)
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未登録のため、サーバーの更新は行いませんでした。"
