# 対戦サーバー（Cloudflare Workers）を自動で更新する。
# main に push したとき、サーバーに関わるファイル（server/ と src/shared/）が変わっていれば、
# テストを通してから wrangler deploy を行う。Actions の画面から手動でも実行できる。
#
# 最初に一度だけ、リポジトリの Settings → Secrets and variables → Actions → Secrets に次の2つを登録する：
#   CLOUDFLARE_API_TOKEN  … Cloudflare で「Edit Cloudflare Workers」テンプレートから作った API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウントID
# 登録していない間は、更新の手順を飛ばす（失敗にはしない）。
name: Deploy server to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/shared/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 対戦の計算（シミュレーション）のテストを通ったときだけ更新する
      - run: npm ci
      - run: npm test
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      # 登録した値の前後の空白・改行や「Bearer 」が混ざっていても動くように取り除いてから使う。
      # 値そのものはログに出さず、文字数だけ出す（アカウントIDは32文字。トークンは数十文字の1かたまり）
      - name: Deploy Worker
        if: env.HAS_TOKEN == 'true'
        working-directory: server
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]' | sed -e 's/^[Bb]earer//')"
          ACCOUNT="$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')"
          echo "トークンの文字数: ${#TOKEN} / アカウントIDの文字数: ${#ACCOUNT}"
          CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT" npx wrangler deploy
      - name: Skip (secrets not set)
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未登録のため、サーバーの更新は行いませんでした。"
